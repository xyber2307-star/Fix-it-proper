<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #f5f5f3;
        color: #1c1b18;
        font-family: ui-sans-serif, system-ui, sans-serif;
        padding: 56px 72px;
      }
      .brand { display: flex; align-items: center; gap: 16px; }
      .mark {
        width: 56px;
        height: 56px;
        background: #0b5e4b;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 30px;
        font-weight: 600;
      }
      .brand p { font-family: Georgia, serif; font-size: 34px; font-weight: 600; }
      h1 {
        font-family: Georgia, serif;
        font-size: 52px;
        line-height: 1.15;
        font-weight: 600;
        margin-top: 28px;
        max-width: 1000px;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e0da;
        border-radius: 8px;
        margin-top: 28px;
        padding: 20px 24px;
      }
      .row { display: flex; align-items: center; gap: 12px; }
      .rank { font-family: Georgia, serif; font-size: 24px; color: #5c5952; }
      .badge {
        background: #fdf0dc;
        color: #9a5b00;
        font-size: 14px;
        font-weight: 600;
        border-radius: 4px;
        padding: 3px 8px;
      }
      .card-title { font-family: Georgia, serif; font-size: 24px; font-weight: 600; }
      code {
        display: block;
        margin-top: 10px;
        background: #f5f5f3;
        border-radius: 4px;
        padding: 8px 10px;
        font-family: ui-monospace, monospace;
        font-size: 15px;
      }
      .cta {
        display: inline-block;
        margin-top: 24px;
        background: #0b5e4b;
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        border-radius: 6px;
        padding: 14px 28px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <span class="mark">&#8981;</span>
      <p>Fix It Proper</p>
    </div>
    <h1>Find the specific problems on your website, ranked by what to fix first.</h1>
    <div class="card">
      <div class="row">
        <span class="rank">1</span>
        <span class="badge">Medium</span>
        <span class="card-title">Title tag exceeds 60 characters</span>
      </div>
      <code>Example Business - Best Affordable Plumbing Services in Springfield Area</code>
    </div>
    <span class="cta">Analyze website</span>
  </body>
</html>
