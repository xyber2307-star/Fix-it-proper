[project]
name = "fixitproper-backend"
version = "0.1.0"
description = "Fix It Proper backend: website diagnosis API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.7",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "groq>=0.4",
  "playwright>=1.44",
  "uvicorn>=0.29",
  "firebase-admin>=7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.5",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "firebase_admin.*"
ignore_missing_imports = true
